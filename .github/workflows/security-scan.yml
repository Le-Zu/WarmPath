name: Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  npm-audit:
    name: NPM Audit (Strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install root dependencies
        run: npm install

      - name: Run Strict Security Audit
        run: npm run audit:ci

  socket-scan:
    name: Socket Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Socket Security Scan
        uses: SocketDev/action@v1
        with:
          # Use 'firewall-free' for the Socket Free plan
          mode: firewall-free
          socket-token: ${{ secrets.SOCKET_SECURITY_API_KEY }}
        continue-on-error: true
