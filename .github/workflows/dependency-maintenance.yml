name: Weekly Dependency Maintenance

on:
  schedule:
    - cron: '0 0 * * 1' # Every Monday at midnight
  workflow_dispatch: # Allows manual trigger

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm run setup

      - name: Run Security Audit Fix
        run: npm run audit:fix:all
        continue-on-error: true

      - name: Validate Build
        run: npm run validate

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: automated security audit fix"
          title: "Automated Dependency Maintenance"
          body: |
            This is an automated pull request created by the Weekly Dependency Maintenance workflow.
            
            Actions performed:
            - Ran `npm audit fix` in root, server, and frontend directories.
            - Updated `package-lock.json` files.
            
            Please review the changes and merge if tests pass.
          branch: "auto-maintenance"
          delete-branch: true
