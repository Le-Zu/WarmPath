name: Deploy Backend to Render

on:
  push:
    branches:
      - main # Change this if production branch is named differently

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      deployments: write # (Required) Updates the Deployments dashboard
    steps:
      - name: Deploy to Render and Log Environment
        uses: JorgeLNJunior/render-deploy@v1.5.0
        with:
          service_id: ${{ secrets.RENDER_SERVICE_ID }}
          api_key: ${{ secrets.RENDER_API_KEY }}
          github_deployment: true # 
          deployment_environment: 'Render-Production' # The name that appears in GitHub
          github_token: ${{ secrets.GITHUB_TOKEN }}
          wait_deploy: true
          
