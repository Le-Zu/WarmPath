name: CI

# Trigger this workflow on pushes and PRs to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x] 

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Setup Workspace & Install All Dependencies        
      env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
      run: npm run setup
      
    # This runs test script in package.json
    - name: Run Tests
      run: npm test --if-present

    # Ensures the React frontend actually builds without errors
    - name: Build Project
      run: npm run build:client --if-present
 
