name: Monthly Full Dependency Upgrade

on:
  schedule:
    - cron: '0 0 1 * *' # Run at midnight on the 1st of every month
  workflow_dispatch: # Allows you to trigger this manually from the Actions tab

jobs:
  full-upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'npm'

      - name: Run Full Upgrade and Refresh
        run: npm run upgrade:all

      - name: Validate Project
        run: npm run validate

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: monthly full dependency upgrade"
          title: "🚀 Monthly Full Dependency Upgrade"
          body: |
            This is an automated "Deep Refresh" of all project dependencies.
            
            **Actions performed:**
            - Checked for latest versions using `npm-check-updates`.
            - Deleted all `package-lock.json` and `node_modules`.
            - Regenerated clean lockfiles.
            - Validated the build passes with the new versions.
            
            Please review and test thoroughly before merging.
          branch: "monthly-upgrade-refresh"
          delete-branch: true
